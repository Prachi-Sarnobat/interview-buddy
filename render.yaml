services:
  - type: web
    name: interview-buddy-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate
    startCommand: gunicorn backend.wsgi:application
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "interview-buddy-api.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://interview-buddy.prachisarnobatsarnobat.workers.dev"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://interview-buddy.prachisarnobatsarnobat.workers.dev"
      - key: AI_PROVIDER
        value: mock